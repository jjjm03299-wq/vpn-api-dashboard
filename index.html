<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPN API Dashboard & Control Center</title>
    <!-- Auto-redirect to ensure clean trailing slash for Service Worker scope on GitHub Pages -->
    <script>
        if (!window.location.pathname.endsWith('/') && !window.location.hostname.includes('localhost')) {
            window.location.pathname += '/';
        }
    </script>
    <!-- Google Fonts API -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .badge-version {
            background: var(--card-bg);
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        @media (max-width: 640px) {
            .grid { grid-template-columns: 1fr; }
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .card-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .status-display {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.25rem;
            font-weight: 600;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: var(--accent-red);
            box-shadow: 0 0 10px var(--accent-red);
            transition: all 0.3s ease;
        }

        .status-dot.connected {
            background-color: var(--accent-green);
            box-shadow: 0 0 10px var(--accent-green);
        }

        .metric-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
        }

        .metric-value {
            font-weight: 600;
        }

        .controls-card {
            grid-column: 1 / -1;
        }

        select, button {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: #0f172a;
            color: var(--text-primary);
            font-size: 1rem;
            font-weight: 500;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        select:focus, button:hover {
            border-color: var(--accent-blue);
        }

        .btn-connect {
            background-color: var(--accent-green);
            color: #000;
            border: none;
            font-weight: 700;
        }

        .btn-connect:hover {
            opacity: 0.9;
        }

        .btn-disconnect {
            background-color: var(--accent-red);
            color: #fff;
            border: none;
            font-weight: 700;
        }

        .console-card {
            grid-column: 1 / -1;
            background-color: #090d16;
            font-family: monospace;
            font-size: 0.85rem;
            max-height: 200px;
            overflow-y: auto;
            color: #38bdf8;
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🔒 VPN API Dashboard</h1>
            <div id="versionBadge" class="badge-version">SW: Loading...</div>
        </header>

        <div class="grid">
            <!-- Status Card -->
            <div class="card">
                <div class="card-title">Connection Status</div>
                <div class="status-display">
                    <div id="statusDot" class="status-dot"></div>
                    <span id="statusText">Not Connected</span>
                </div>
                <div class="metric-row">
                    <span>Protection:</span>
                    <span id="protectionBadge" style="color: var(--accent-red);">Unprotected</span>
                </div>
                <div class="metric-row">
                    <span>Connection Time:</span>
                    <span id="timerDisplay" class="metric-value">00:00</span>
                </div>
            </div>

            <!-- Network & IP Card -->
            <div class="card">
                <div class="card-title">Network Details</div>
                <div class="metric-row">
                    <span>Virtual IP:</span>
                    <span id="ipDisplay" class="metric-value">127.0.0.1</span>
                </div>
                <div class="metric-row">
                    <span>Active Location:</span>
                    <span id="locationDisplay" class="metric-value">Local Network</span>
                </div>
                <div class="metric-row">
                    <span>Proxy Health:</span>
                    <span id="healthDisplay" class="metric-value" style="color: var(--accent-green);">Checking...</span>
                </div>
            </div>

            <!-- Controls Card -->
            <div class="card controls-card">
                <div class="card-title">Select VPN Gateway Node</div>
                <select id="countrySelect">
                    <option value="">Loading countries...</option>
                </select>
                <button id="toggleBtn" class="btn-connect" onclick="toggleConnection()">Connect VPN</button>
            </div>

            <!-- Console Log Output -->
            <div class="card console-card" id="logConsole">
                [System] Initializing service worker proxy connection...
            </div>
        </div>
    </div>

    <script>
        let isConnected = false;
        let timerInterval = null;
        let secondsElapsed = 0;

        // Register Service Worker and wait for it to control the page
        if ('serviceWorker' in navigator) {
            const basePath = window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/'));
            
            navigator.serviceWorker.register('./App.js', { scope: basePath + '/' })
                .then(async (registration) => {
                    logMessage('Service Worker registered successfully.');

                    // Wait for the service worker to become active and take control
                    if (!navigator.serviceWorker.controller) {
                        logMessage('Waiting for Service Worker activation...');
                        await new Promise((resolve) => {
                            navigator.serviceWorker.addEventListener('controllerchange', () => {
                                resolve();
                            }, { once: true });
                        });
                    }

                    logMessage('Service Worker is active and intercepting network traffic.');
                    fetchAppData();
                })
                .catch(err => logMessage('Service Worker registration failed: ' + err.message));
        }

        async function fetchAppData() {
            try {
                // Fetch version
                const verRes = await fetch('./api/vpn/version');
                const verData = await verRes.json();
                document.getElementById('versionBadge').textContent = `v${verData.version}`;

                // Fetch countries list
                const countRes = await fetch('./api/vpn/countries');
                const countData = await countRes.json();
                const select = document.getElementById('countrySelect');
                select.innerHTML = '';
                countData.countries.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c.code;
                    opt.textContent = `${c.flag} ${c.name} (${c.latencyMs}ms)`;
                    select.appendChild(opt);
                });

                // Fetch Health
                const healthRes = await fetch('./api/vpn/health');
                const healthData = await healthRes.json();
                document.getElementById('healthDisplay').textContent = healthData.status;

                // Sync initial status
                checkStatus();
            } catch (err) {
                logMessage('Error fetching initial data: ' + err.message);
            }
        }

        async function checkStatus() {
            try {
                const res = await fetch('./api/vpn/status');
                const data = await res.json();
                updateUIState(data.session);
            } catch (err) {
                console.error(err);
            }
        }

        async function toggleConnection() {
            const countryCode = document.getElementById('countrySelect').value;
            if (!isConnected) {
                logMessage(`Connecting to VPN node (${countryCode})...`);
                const res = await fetch('./api/vpn/connect', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ countryCode })
                });
                const data = await res.json();
                if (data.success) {
                    updateUIState(data.session);
                    startTimer();
                    logMessage(data.message);
                }
            } else {
                logMessage('Disconnecting VPN session...');
                const res = await fetch('./api/vpn/disconnect', { method: 'POST' });
                const data = await res.json();
                if (data.success) {
                    updateUIState({ connected: false, ip: '127.0.0.1', country: 'Local Network' });
                    stopTimer();
                    logMessage(data.message);
                }
            }
        }

        function updateUIState(session) {
            isConnected = session.connected;
            const dot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            const protectionBadge = document.getElementById('protectionBadge');
            const toggleBtn = document.getElementById('toggleBtn');
            const ipDisplay = document.getElementById('ipDisplay');
            const locationDisplay = document.getElementById('locationDisplay');

            if (isConnected) {
                dot.classList.add('connected');
                statusText.textContent = `Connected to ${session.country}`;
                protectionBadge.textContent = 'Protected';
                protectionBadge.style.color = 'var(--accent-green)';
                toggleBtn.textContent = 'Disconnect VPN';
                toggleBtn.className = 'btn-disconnect';
                ipDisplay.textContent = session.ip;
                locationDisplay.textContent = session.country;
            } else {
                dot.classList.remove('connected');
                statusText.textContent = 'Not Connected';
                protectionBadge.textContent = 'Unprotected';
                protectionBadge.style.color = 'var(--accent-red)';
                toggleBtn.textContent = 'Connect VPN';
                toggleBtn.className = 'btn-connect';
                ipDisplay.textContent = session.ip;
                locationDisplay.textContent = session.country || 'Local Network';
            }
        }

        function startTimer() {
            secondsElapsed = 0;
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                secondsElapsed++;
                const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
                const secs = String(secondsElapsed % 60).padStart(2, '0');
                document.getElementById('timerDisplay').textContent = `${mins}:${secs}`;
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            secondsElapsed = 0;
            document.getElementById('timerDisplay').textContent = '00:00';
        }

        function logMessage(msg) {
            const consoleBox = document.getElementById('logConsole');
            const timestamp = new Date().toLocaleTimeString();
            consoleBox.innerHTML += `<div>[${timestamp}] ${msg}</div>`;
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }
    </script>
</body>
</html>
